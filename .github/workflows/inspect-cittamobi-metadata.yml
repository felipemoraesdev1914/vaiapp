name: Inspect Cittamobi Barueri route metadata

on:
  push:
    branches:
      - investigate/barueri-osm-transit
    paths:
      - scripts/probe-cittamobi-public-pages.mjs
      - .github/workflows/inspect-cittamobi-metadata.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: investigate/barueri-osm-transit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect public Cittamobi route pages and browser assets
        run: node scripts/probe-cittamobi-public-pages.mjs
      - name: Save probe results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/data/barueri-cittamobi-lines-source.json
          git commit -m "Add Cittamobi public route metadata probe"
          git push
