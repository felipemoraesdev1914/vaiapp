name: Geocode Barueri municipal bus stops

on:
  push:
    branches:
      - investigate/barueri-osm-transit
    paths:
      - scripts/geocode-barueri-cittamobi-stops.mjs
      - .github/workflows/geocode-barueri-stops.yml

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: investigate/barueri-osm-transit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Geocode every distinct Cittamobi stop address
        env:
          GEOCODE_LIMIT: "0"
        run: node scripts/geocode-barueri-cittamobi-stops.mjs
      - name: Save full geocoded municipal route data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/data/barueri-cittamobi-geocoded-stops.json
          git commit -m "Add geocoded Barueri municipal stop network"
          git push
