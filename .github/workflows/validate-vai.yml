name: VAI validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - projeto-completo-2026-11-13

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Barueri Cittamobi catalog
        run: node scripts/validate-barueri-cittamobi.mjs

      - name: Validate Barueri line inventory
        run: node scripts/validate-barueri-cittamobi-inventory.mjs

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build API
        run: pnpm --filter @workspace/api-server build

      - name: Build VAI frontend
        env:
          PORT: 10000
          BASE_PATH: /
          NODE_ENV: production
        run: pnpm --filter vai-mobilidade build
