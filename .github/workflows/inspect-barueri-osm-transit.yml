name: Inspect Barueri OSM bus network

on:
  push:
    branches:
      - investigate/barueri-osm-transit

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: investigate/barueri-osm-transit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch public OSM route and stop data
        run: node scripts/fetch-barueri-osm-transit.mjs
      - name: Commit collected data for inspection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/data/barueri-osm-bus-network.json
          git commit -m "Add OpenStreetMap Barueri bus network snapshot"
          git push
